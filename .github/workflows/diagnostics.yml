name: Hardware diagnostics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: |
          git submodule update --init libDaisy
          git -C libDaisy submodule update --init --recursive --jobs 4
      - name: Install pinned ARM toolchain
        run: |
          bash scripts/install-toolchain.sh
          echo "$GITHUB_WORKSPACE/.tools/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Host tests (protocol, LED modes, session)
        run: make -C firmware test
      - name: Host tests with ASan and UBSan
        run: make -C firmware test-sanitize
      - name: Cross-compile firmware
        run: make -C firmware -j4
      - name: Check image and read-only FatFs usage
        run: make -C firmware check
      - name: Checksum
        run: cd firmware/build && sha256sum DaisyDiagnostic.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DaisyDiagnostic-firmware-${{ github.sha }}
          path: |
            firmware/build/DaisyDiagnostic.bin
            firmware/build/DaisyDiagnostic.elf
            firmware/build/SHA256SUMS
          if-no-files-found: error

  windows-app:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Python, protocol and GUI tests (simulation, headless)
        run: python -m pytest tests/python -v
      - name: Build EXE
        run: cmd /c windows\build_exe.cmd
      - name: Start EXE in simulation mode
        run: |
          $p = Start-Process -FilePath windows\dist\DaisyDiagnostic.exe `
               -ArgumentList '--sim', '--selftest', '5' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE selftest failed: $($p.ExitCode)" }
      - name: Checksum
        run: |
          Get-FileHash windows\dist\DaisyDiagnostic.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  DaisyDiagnostic.exe" } |
            Set-Content windows\dist\SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DaisyDiagnostic-windows-${{ github.sha }}
          path: |
            windows/dist/DaisyDiagnostic.exe
            windows/dist/SHA256SUMS
          if-no-files-found: error
